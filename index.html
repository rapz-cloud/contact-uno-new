<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14! Uno'o · space elegan</title>
    <!-- Font & icon (opsional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #0c0b1a, #03010a 80%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* nuansa angkasa: bintang lembut & nebula */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="glow" cx="30%" cy="40%" r="70%"><stop offset="0%" stop-color="%23b19cd9" stop-opacity="0.15"/><stop offset="80%" stop-color="%23302058" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="url(%23glow)"/><circle cx="15%" cy="20%" r="2" fill="white" opacity="0.7"/><circle cx="80%" cy="15%" r="3" fill="white" opacity="0.8"/><circle cx="70%" cy="85%" r="2.5" fill="white" opacity="0.6"/><circle cx="25%" cy="70%" r="4" fill="white" opacity="0.4"/><circle cx="90%" cy="45%" r="2" fill="white" opacity="0.9"/><circle cx="45%" cy="10%" r="1.8" fill="white" opacity="0.5"/><circle cx="5%" cy="92%" r="3.5" fill="white" opacity="0.5"/><circle cx="60%" cy="30%" r="2.2" fill="white" opacity="0.7"/><circle cx="95%" cy="75%" r="2" fill="white" opacity="0.6"/><circle cx="12%" cy="48%" r="2.5" fill="white" opacity="0.8"/></svg>') repeat;
            opacity: 0.8;
            pointer-events: none;
        }

        /* glitter samar */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 70% 20%, rgba(180, 150, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .glass-card {
            position: relative;
            z-index: 10;
            max-width: 650px;
            width: 100%;
            background: rgba(12, 8, 25, 0.55);
            backdrop-filter: blur(10px) saturate(180%);
            -webkit-backdrop-filter: blur(10px) saturate(180%);
            border: 1px solid rgba(210, 190, 255, 0.2);
            border-radius: 48px;
            padding: 3rem 2rem 3.2rem;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(200, 170, 255, 0.15) inset, 0 0 30px rgba(130, 90, 210, 0.3);
            text-align: center;
        }

        /* judul utama */
        .main-title {
            font-size: clamp(2.8rem, 10vw, 4.3rem);
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #f0eaff;
            text-shadow: 0 0 10px #8f7cd6, 0 0 25px #6236c7, 0 0 45px #3f1e8e;
            margin-bottom: 1rem;
            line-height: 1.1;
            word-break: break-word;
        }

        /* lingkaran logo */
        .logo-ring {
            margin: 1.5rem auto 2rem auto;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 40px #9770e6, 0 0 10px #cfaaff, 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 215, 255, 0.6);
            padding: 6px;
            backdrop-filter: blur(2px);
        }

        .logo-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #1b122b;
            border: 2px solid #cdb6ff;
            box-shadow: inset 0 0 10px #00000070;
        }

        .contact-label {
            font-size: 1rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #cbbaff;
            margin: 2.2rem 0 1.2rem 0;
            text-shadow: 0 0 8px #9c7eff;
            word-spacing: 4px;
        }
        .contact-label span {
            background: rgba(40, 20, 70, 0.5);
            padding: 0.2rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 220, 255, 0.15);
            font-weight: 400;
        }

        /* grid tombol elegan */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.6rem;
            align-items: stretch;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.1rem 1.5rem;
            background: rgba(10, 6, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(210, 180, 255, 0.25);
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #f2e9ff;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: 0.25s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(200, 160, 255, 0.1) inset;
            text-shadow: 0 2px 5px black;
        }

        .social-btn i { 
            font-style: normal;
            font-size: 1.5rem;
            filter: drop-shadow(0 0 5px currentColor);
        }

        /* warna ikon lembut */
        .btn-wa-channel i { color: #b991ff; }   /* whatsapp channel */
        .btn-wa i { color: #b3e0b0; }           /* whatsapp pribadi */
        .btn-telegram i { color: #8ab2f0; }
        .btn-tiktok i { color: #f5acd0; }
        .btn-instagram i { color: #f2b2d3; }

        /* hover naik + bercahaya */
        .social-btn:hover {
            transform: translateY(-4px);
            background: rgba(40, 22, 70, 0.8);
            border-color: #dbbdff;
            box-shadow: 0 16px 28px -6px #25174b, 0 0 18px #bc9bff;
        }

        /* sedikit variasi warna teks/hover */
        .btn-wa-channel:hover i { color: #e2c3ff; }
        .btn-wa:hover i { color: #d2ffc0; }
        .btn-telegram:hover i { color: #b8d4ff; }
        .btn-tiktok:hover i { color: #ffc1e0; }
        .btn-instagram:hover i { color: #ffd0e6; }

        /* footer tipis (opsional) */
        .cosmic-note {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #9e8fc9;
            opacity: 0.6;
            letter-spacing: 1px;
            border-top: 1px dashed rgba(200,180,255,0.2);
            padding-top: 1.2rem;
        }

        /* penyesuaian mobile */
        @media (max-width: 450px) {
            .glass-card { padding: 2rem 1.5rem; }
            .main-title { letter-spacing: 3px; }
            .contact-label { letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <!-- JUDUL 14! Uno'o -->
        <h1 class="main-title">14! UNO'O</h1>

        <!-- LOGO LINGKARAN (URL YANG DIBERIKAN) -->
        <div class="logo-ring">
            <img src="https://c.termai.cc/i140/64J1.jpg" alt="logo uno circle" loading="lazy">
        </div>

        <!-- TEKS "CONTACT UNO" DI ATAS BUTTON -->
        <div class="contact-label">
            <span>✧ CONTACT UNO ✧</span>
        </div>

        <!-- Kumpulan button sosial media - masing-masing mengarah ke url sendiri -->
        <div class="button-grid">

            <!-- SALURAN WHATSAPP -->
            <a href="https://whatsapp.com/channel/0029VbCWPlLJUM2Wpg1vXx06" target="_blank" rel="noopener" class="social-btn btn-wa-channel">
                <i></i> WhatsApp Channel
            </a>

            <!-- WHATSAPP PRIBADI -->
            <a href="https://wa.me/6283172299901" target="_blank" rel="noopener" class="social-btn btn-wa">
                <i></i> WhatsApp
            </a>

            <!-- TELEGRAM -->
            <a href="https://t.me/rapzzxtamz" target="_blank" rel="noopener" class="social-btn btn-telegram">
                <i></i> Telegram
            </a>

            <!-- TIKTOK -->
            <a href="https://www.tiktok.com/@style.fomo34" target="_blank" rel="noopener" class="social-btn btn-tiktok">
                <i></i> TikTok
            </a>

            <!-- INSTAGRAM -->
            <a href="https://www.instagram.com/uno.onee1" target="_blank" rel="noopener" class="social-btn btn-instagram">
                <i></i> Instagram
            </a>
        </div>

        <!-- sentuhan kosmik kecil (hanya estetik) -->
        <div class="cosmic-note">
            ⚡ 14! Uno'o  anti  redup ⚡
        </div>
    </div>

    <!-- sedikit efek bintang jatuh (opsional, tambahan angkasa) -->
    <div style="position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 1;">
        <div style="position:absolute; top:15%; left:85%; width:3px; height:3px; background:white; border-radius:50%; box-shadow:0 0 12px #f3e7ff; opacity:0.7;"></div>
        <div style="position:absolute; top:70%; left:12%; width:4px; height:4px; background:#f2d9ff; border-radius:50%; box-shadow:0 0 20px #b798ff;"></div>
    </div>
</body>
  </html>
