<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14! Uno'o · 黑黑 · Yes i am</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #030003;
            background-image: radial-gradient(circle at 20% 30%, #2f0a1a 0%, #070009 45%, #000 90%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            color: #edd6ff;
        }

        .dead-stars {
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><circle cx="3%" cy="8%" r="1.2" fill="%23aa8888" opacity="0.4"/><circle cx="91%" cy="19%" r="1.5" fill="%23aa7a7a" opacity="0.5"/><circle cx="73%" cy="84%" r="1.1" fill="%23996666" opacity="0.4"/><circle cx="42%" cy="53%" r="2" fill="%23b34444" opacity="0.3"/><circle cx="58%" cy="22%" r="1.3" fill="%23d17979" opacity="0.5"/><circle cx="12%" cy="91%" r="1.8" fill="%23993333" opacity="0.4"/><circle cx="88%" cy="67%" r="1.4" fill="%23aa4c4c" opacity="0.5"/></svg>');
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .red-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }
        .glow-corner {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .glow-corner::before,
        .glow-corner::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff3b3b20, #8b000015, transparent 80%);
            filter: blur(70px);
        }
        .glow-corner::before {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, #b3002d30, #4a001030, transparent 85%);
            box-shadow: 0 0 150px #a00;
        }
        .glow-corner::after {
            bottom: -250px;
            left: -150px;
            background: radial-gradient(circle, #99003d25, #2f001540, transparent 80%);
            filter: blur(90px);
        }
        /* tambahan dari sisi lain */
        .glow-side {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        .glow-side span {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #c96b6b1a, #5f000010, transparent 75%);
            filter: blur(60px);
        }
        .glow-side span:nth-child(1) { top: 10%; left: 5%; }
        .glow-side span:nth-child(2) { bottom: 5%; right: 8%; background: radial-gradient(circle, #ff5a5a1a, #61000010, transparent 80%); }
        .glow-side span:nth-child(3) { top: 40%; left: 80%; width: 400px; height: 400px; background: #a5222212; filter: blur(100px); }

        /* bulan merah berdarah */
        .blood-moon {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #ffc1c1, #a12222 70%, #3c0303);
            border-radius: 50%;
            box-shadow: 0 0 100px #ff4444, 0 0 200px #a00000;
            opacity: 800.0;
            z-index: 3;
            mix-blend-mode: lighten;
            border: 2px solid #a02020;
        }
        .blood-moon::after {
            content: '';
            position: absolute;
            top: 25px; left: 20px;
            width: 25px; height: 25px;
            background: #ffc4c4;
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: 0 0 20px #f9f2f2;
        }
        .blood-moon::before {
            content: '';
            position: absolute;
            bottom: 15px; right: 18px;
            width: 35px; height: 35px;
            background: #470000;
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(5px);
        }

        .red-shooting {
            position: fixed;
            top: 12%;
            left: 80%;
            width: 5px;
            height: 5px;
            background: #ff7b7b;
            border-radius: 50%;
            box-shadow: 0 0 40px #ff2222, 0 0 80px #b10000;
            animation: shootRed 14s infinite;
            z-index: 4;
            opacity: 0.7;
        }
        .red-shooting.second {
            top: 60%;
            left: 15%;
            animation: shootRed 19s 3s infinite;
            width: 4px;
            height: 4px;
        }
        @keyframes shootRed {
            0% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            30% { transform: translate(-300px, 180px) scale(0.6); opacity: 0.5; }
            70% { transform: translate(-600px, 380px) scale(0.2); opacity: 0.2; }
            100% { transform: translate(-900px, 600px) scale(0); opacity: 0; }
        }

        .dark-petal-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .dark-petal {
            position: absolute;
            background: rgba(110, 20, 30, 0.4);
            width: 18px;
            height: 24px;
            border-radius: 70% 30% 60% 40% / 50% 40% 60% 50%;
            border: 1px solid #9d3a3a30;
            box-shadow: 0 0 15px #b33030, 0 0 30px #4f0000;
            opacity: 0.5;
            animation: fallDark linear infinite;
            filter: blur(1px);
        }
        .dark-petal:nth-child(odd) {
            background: rgba(80, 0, 0, 0.6);
            border-color: #a5252550;
        }
        .dark-petal:nth-child(3n) {
            background: rgba(150, 30, 30, 0.5);
            box-shadow: 0 0 20px #d53c3c;
        }
        @keyframes fallDark {
            0% { top: -5%; transform: rotate(0deg) translateX(0); opacity: 0.7; }
            20% { transform: rotate(25deg) translateX(25px); }
            40% { transform: rotate(5deg) translateX(-15px); }
            60% { transform: rotate(35deg) translateX(20px); }
            100% { top: 110%; transform: rotate(60deg) translateX(-40px); opacity: 0.2; }
        }

        .glass-card {
            position: relative;
            z-index: 20;
            max-width: 620px;
            width: 100%;
            background: rgba(5, 0, 8, 0.6);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border: 1px solid rgba(180, 40, 40, 0.3);
            border-radius: 60px;
            padding: 2.8rem 2rem 3rem;
            box-shadow: 0 40px 80px -20px #4f0000, 0 0 0 1px rgba(200, 50, 50, 0.3) inset, 0 0 70px #b30000;
            text-align: center;
        }

        .main-title {
            font-size: clamp(2.5rem, 9vw, 4rem);
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #ffe6f0;
            text-shadow: 0 0 15px #ff4d4d, 0 0 35px #a30000, 0 0 70px #5f0000;
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }

        /* logo ring dengan pinggiran merah menyala */
        .logo-ring {
            margin: 1.8rem auto 2rem auto;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #0f000f;
            box-shadow: 0 0 60px #ff3b3b, 0 0 120px #b10202, 0 0 30px #ff8888 inset;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ff5e5e;
            padding: 5px;
            backdrop-filter: blur(4px);
            animation: pulseBorder 3s infinite;
        }
        @keyframes pulseBorder {
            0% { box-shadow: 0 0 40px #ff4646, 0 0 100px #a30000, 0 0 30px #ff8888 inset; border-color: #ff7a7a; }
            50% { box-shadow: 0 0 80px #ff0000, 0 0 180px #c20000, 0 0 50px #ff5e5e inset; border-color: #ff0000; }
            100% { box-shadow: 0 0 40px #ff4646, 0 0 100px #a30000, 0 0 30px #ff8888 inset; border-color: #ff7a7a; }
        }

        .logo-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #1e001e;
            border: 1px solid #ffa0a0;
            box-shadow: inset 0 0 30px #ff3333;
        }

        .contact-label {
            font-size: 0.95rem;
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffb8b8;
            margin: 2rem 0 1.3rem 0;
            text-shadow: 0 0 12px #ff4d4d;
        }
        .contact-label span {
            background: rgba(40, 0, 0, 0.5);
            padding: 0.2rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(8px);
            border: 1px solid #b33b3b;
            font-weight: 200;
            letter-spacing: 5px;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            padding: 1rem 1.5rem;
            background: rgba(20, 0, 10, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #b34f4f;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 300;
            color: #ffe3f0;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px -8px #560000, 0 0 15px #b30000 inset;
            text-shadow: 0 2px 10px #300;
        }

        .social-btn i {
            font-style: normal;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 8px #ff6969);
            color: #ffa4a4;
        }

        .btn-wa-channel i { color: #ffb3b3; }
        .btn-wa i { color: #ffa3a3; }
        .btn-telegram i { color: #ff9e9e; }
        .btn-tiktok i { color: #ffbaba; }
        .btn-instagram i { color: #ffa7a7; }

        .social-btn:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(70, 0, 20, 0.7);
            border-color: #ff8a8a;
            box-shadow: 0 20px 40px -12px #b30000, 0 0 35px #ff3737;
        }

        .social-btn:hover i {
            color: #ffe2e2;
        }

        .cosmic-note {
            margin-top: 9.3rem;
            font-size: 0.9rem;
            color: #ff3737;
            opacity: 10.0;
            letter-spacing: 2px;
            border-top: 1px dashed #b34444;
            padding-top: 1.3rem;
            font-weight: 800;
        }

        @media (max-width: 450px) {
            .glass-card { padding: 1.8rem 1.2rem; border-radius: 42px; }
            .main-title { letter-spacing: 3px; }
            .blood-moon { width: 70px; height: 70px; top: 10px; right: 15px; }
        }
    </style>
</head>
<body>
    <!-- bintang mati -->
    <div class="dead-stars"></div>

    <!-- lapisan cahaya merah dari berbagai sisi -->
    <div class="red-glow">
        <div class="glow-corner"></div>
        <div class="glow-side">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- bulan merah (blood moon) -->
    <div class="blood-moon"></div>

    <!-- bintang jatuh merah -->
    <div class="red-shooting"></div>
    <div class="red-shooting second"></div>

    <!-- kelopak hitam merah -->
    <div class="dark-petal-container" id="dark-petal-container"></div>

    <!-- KARTU UTAMA -->
    <div class="glass-card">
        <h1 class="main-title">14! UNO'O</h1>

        <div class="logo-ring">
            <img src="https://c.termai.cc/i140/64J1.jpg" alt="uno logo" loading="lazy">
        </div>

        <div class="contact-label">
            <span>✮ CONTACT ME ✮</span>
        </div>

        <div class="button-grid">
            <a href="https://whatsapp.com/channel/0029VbCWPlLJUM2Wpg1vXx06" target="_blank" rel="noopener" class="social-btn btn-wa-channel">
                <i>❂</i> WhatsApp Channel
            </a>
            <a href="https://wa.me/6283172299901" target="_blank" rel="noopener" class="social-btn btn-wa">
                <i>✺</i> WhatsApp
            </a>
            <a href="https://t.me/rapzzxtamz" target="_blank" rel="noopener" class="social-btn btn-telegram">
                <i>☯</i> Telegram
            </a>
            <a href="https://www.tiktok.com/@style.fomo34" target="_blank" rel="noopener" class="social-btn btn-tiktok">
                <i>⛧</i> TikTok
            </a>
            <a href="https://www.instagram.com/uno.onee1" target="_blank" rel="noopener" class="social-btn btn-instagram">
                <i>ⵔ</i> Instagram
            </a>
        </div>

        <div class="cosmic-note">
            🜁 黑櫻 • 14! Uno'o Is Here • 血櫻 🜁
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('dark-petal-container');
            if (!container) return;
            for (let i = 0; i < 80; i++) {
                const petal = document.createElement('div');
                petal.classList.add('dark-petal');
                const w = 14 + Math.floor(Math.random() * 18);
                petal.style.width = w + 'px';
                petal.style.height = (w * 1.2) + 'px';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (7 + Math.random() * 18) + 's';
                petal.style.animationDelay = (Math.random() * -20) + 's';
                petal.style.opacity = 0.2 + Math.random() * 0.4;
                petal.style.filter = `blur(${Math.random() * 1.5}px)`;
                container.appendChild(petal);
            }
        })();
    </script>
</body>
</html>
