<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14! Uno'o · 血櫻 · Alive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #030003;
            background-image: radial-gradient(circle at 20% 30%, #2f0a1a 0%, #070009 45%, #000 90%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            color: #edd6ff;
        }

        /* Enhanced dead stars - lebih banyak */
        .dead-stars {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(1px 1px at 3% 8%, #ffaaaa, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 91% 19%, #ff9999, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 73% 84%, #ff8888, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 42% 53%, #ff7777, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 58% 22%, #ffb5b5, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 12% 91%, #ff6b6b, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 88% 67%, #ff8a8a, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 25% 35%, #ff5f5f, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 67% 42%, #ff9d9d, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 81% 93%, #ff7a7a, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 44% 17%, #ffaeae, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 96% 48%, #ff6363, rgba(0,0,0,0));
            background-repeat: no-repeat;
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        /* Enhanced red glow - lebih dinamis */
        .red-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }
        
        .glow-orb {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff4d4d30, #8b000020, transparent 80%);
            filter: blur(100px);
            animation: floatGlow 20s infinite alternate ease-in-out;
        }
        
        .glow-orb:nth-child(1) {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, #ff2b2b40, #4a001030, transparent 85%);
            animation-duration: 15s;
        }
        
        .glow-orb:nth-child(2) {
            bottom: -300px;
            left: -150px;
            background: radial-gradient(circle, #ff3a3a35, #2f001540, transparent 80%);
            width: 700px;
            height: 700px;
            animation-duration: 18s;
            animation-delay: -5s;
        }
        
        .glow-orb:nth-child(3) {
            top: 30%;
            left: 60%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff5e5e25, #61000015, transparent 80%);
            animation-duration: 22s;
            animation-delay: -10s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(50px, -50px) scale(1.2); opacity: 0.5; }
            100% { transform: translate(-50px, 30px) scale(0.9); opacity: 0.3; }
        }

        /* Enhanced blood moon - lebih hidup */
        .blood-moon {
            position: fixed;
            top: 30px;
            right: 40px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffd3d3, #c23b3b 60%, #5c0606);
            box-shadow: 0 0 150px #ff5e5e, 0 0 250px #c03939;
            z-index: 3;
            mix-blend-mode: screen;
            border: 2px solid #ff9e9e;
            animation: moonPulse 4s infinite alternate ease-in-out;
        }
        
        @keyframes moonPulse {
            0% { box-shadow: 0 0 150px #ff5e5e, 0 0 250px #c03939; transform: scale(1); }
            100% { box-shadow: 0 0 200px #ff3737, 0 0 300px #ff0000; transform: scale(1.1); }
        }

        .blood-moon::after {
            content: '';
            position: absolute;
            top: 25px;
            left: 20px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fff5f5, #ffb8b8);
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(2px);
        }

        /* Enhanced shooting stars - lebih banyak dan bervariasi */
        .shooting-star {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ff6b6b;
            border-radius: 50%;
            box-shadow: 0 0 40px #ff3b3b, 0 0 80px #ff0000;
            z-index: 4;
            opacity: 0;
            animation: shootAcross var(--duration) linear infinite;
            animation-delay: var(--delay);
        }

        @keyframes shootAcross {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }
            30% {
                transform: translate(var(--x1), var(--y1)) scale(0.7);
                opacity: 0.6;
            }
            70% {
                transform: translate(var(--x2), var(--y2)) scale(0.3);
                opacity: 0.3;
            }
            100% {
                transform: translate(var(--x3), var(--y3)) scale(0);
                opacity: 0;
            }
        }

        /* Enhanced petals - lebih banyak dan bervariasi */
        .dark-petal-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .dark-petal {
            position: absolute;
            background: rgba(180, 30, 40, 0.3);
            width: 20px;
            height: 26px;
            border-radius: 70% 30% 60% 40% / 50% 40% 60% 50%;
            border: 1px solid #ff6b6b30;
            box-shadow: 0 0 20px #ff3b3b, 0 0 40px #8b0000;
            animation: fallDark linear infinite;
            filter: blur(1px);
            will-change: transform, opacity;
        }

        @keyframes fallDark {
            0% {
                top: -10%;
                transform: rotate(0deg) translateX(0) scale(1);
                opacity: 0.8;
            }
            25% {
                transform: rotate(120deg) translateX(30px) scale(1.1);
            }
            50% {
                transform: rotate(240deg) translateX(-30px) scale(0.9);
            }
            75% {
                transform: rotate(360deg) translateX(20px) scale(1);
            }
            100% {
                top: 110%;
                transform: rotate(480deg) translateX(-30px) scale(0.5);
                opacity: 0.2;
            }
        }

        /* Main card - lebih elegan */
        .glass-card {
            position: relative;
            z-index: 20;
            max-width: 580px;
            width: 100%;
            background: rgba(8, 0, 12, 0.5);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 80, 80, 0.3);
            border-radius: 48px;
            padding: 2.5rem 2rem 2.8rem;
            box-shadow: 0 40px 80px -20px #4f0000, 0 0 0 1px rgba(255, 60, 60, 0.2) inset, 0 0 80px #ff3333;
            text-align: center;
            animation: cardFloat 6s infinite alternate ease-in-out;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0); box-shadow: 0 40px 80px -20px #4f0000, 0 0 80px #ff3333; }
            100% { transform: translateY(-10px); box-shadow: 0 50px 90px -15px #6b0000, 0 0 100px #ff4d4d; }
        }

        .main-title {
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: #fff0f5;
            text-shadow: 0 0 20px #ff6b6b, 0 0 40px #c03939, 0 0 80px #8b0000;
            margin-bottom: 1rem;
            line-height: 1.1;
            animation: titleGlow 3s infinite alternate;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px #ff6b6b, 0 0 40px #c03939, 0 0 80px #8b0000; }
            100% { text-shadow: 0 0 30px #ff8a8a, 0 0 60px #ff4d4d, 0 0 100px #ff1a1a; }
        }

        /* Logo ring dengan animasi lebih hidup */
        .logo-ring {
            margin: 2rem auto 2.2rem auto;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #0a000a;
            box-shadow: 0 0 70px #ff4d4d, 0 0 140px #b30202, 0 0 40px #ffaaaa inset;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ff8a8a;
            padding: 6px;
            animation: ringPulse 2.5s infinite alternate ease-in-out;
        }

        @keyframes ringPulse {
            0% { box-shadow: 0 0 70px #ff4d4d, 0 0 140px #b30202, 0 0 40px #ffaaaa inset; border-color: #ff8a8a; transform: scale(1); }
            100% { box-shadow: 0 0 100px #ff6b6b, 0 0 200px #ff1a1a, 0 0 60px #ffd4d4 inset; border-color: #ffb5b5; transform: scale(1.05); }
        }

        .logo-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #1e001e;
            border: 2px solid #ffb5b5;
            transition: transform 0.5s ease;
        }

        .logo-ring:hover img {
            transform: rotate(360deg);
            transition: transform 1s ease;
        }

        /* Contact label dengan efek lebih */
        .contact-label {
            margin: 2.2rem 0 1.5rem 0;
        }

        .contact-label span {
            font-size: 0.95rem;
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffd4d4;
            text-shadow: 0 0 15px #ff4d4d;
            background: rgba(60, 0, 0, 0.4);
            padding: 0.3rem 2rem;
            border-radius: 60px;
            backdrop-filter: blur(8px);
            border: 1px solid #ff6b6b;
            display: inline-block;
            animation: labelPulse 3s infinite alternate;
        }

        @keyframes labelPulse {
            0% { opacity: 0.9; letter-spacing: 6px; }
            100% { opacity: 1; letter-spacing: 8px; }
        }

        /* Button grid - minimalis tapi bervariasi */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        /* Variasi tombol dengan style berbeda */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(15, 0, 10, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 300;
            color: #fff0f5;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Variasi border dan shadow tiap tombol */
        .btn-wa-channel {
            border: 1px solid #ff8a8a;
            box-shadow: 0 4px 15px -5px #ff4d4d, 0 0 10px #ff8a8a inset;
        }
        .btn-wa {
            border: 1px solid #ff7a7a;
            box-shadow: 0 4px 15px -5px #ff3b3b, 0 0 10px #ff7a7a inset;
        }
        .btn-telegram {
            border: 1px dashed #ff9e9e;
            box-shadow: 0 4px 15px -5px #ff6b6b;
        }
        .btn-tiktok {
            border: 1px solid #ff8a8a;
            box-shadow: 0 4px 15px -5px #ff4d4d, 0 0 15px #ff4d4d inset;
            background: rgba(30, 0, 15, 0.6);
        }
        .btn-instagram {
            border: 2px dotted #ffb5b5;
            box-shadow: 0 4px 15px -5px #ff8a8a;
        }
        .btn-discord {
            border: 1px solid #ff9e9e;
            box-shadow: 0 4px 15px -5px #ff6b6b, 0 0 5px #ffb5b5 inset;
            background: rgba(20, 0, 12, 0.5);
        }
        .btn-github {
            border: 1px double #ff8a8a;
            box-shadow: 0 4px 15px -5px #ff4d4d;
        }

        /* Icon styling */
        .social-btn i {
            font-style: normal;
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px #ff8a8a);
            transition: all 0.3s ease;
        }

        /* Efek hover yang lebih hidup */
        .social-btn:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(100, 0, 30, 0.7);
            border-color: #ffb5b5;
            box-shadow: 0 15px 30px -8px #ff4d4d, 0 0 25px #ff4d4d;
        }

        .social-btn:hover i {
            transform: rotate(360deg) scale(1.2);
            filter: drop-shadow(0 0 15px #ffb5b5);
        }

        /* Efek ripple pada hover */
        .social-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, #ff8a8a80, transparent);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .social-btn:hover::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        /* Cosmic note dengan efek berkedip */
        .cosmic-note {
            margin-top: 1rem;
            font-size: 1rem;
            color: #ffb5b5;
            opacity: 0.9;
            letter-spacing: 3px;
            border-top: 1px solid #ff6b6b50;
            padding-top: 1.5rem;
            font-weight: 300;
            text-shadow: 0 0 15px #ff3b3b;
            animation: noteFlicker 2.5s infinite alternate;
        }

        @keyframes noteFlicker {
            0% { opacity: 0.7; text-shadow: 0 0 15px #ff3b3b; }
            100% { opacity: 1; text-shadow: 0 0 25px #ff8a8a, 0 0 10px #ff0000; }
        }

        /* Responsive */
        @media (max-width: 450px) {
            .glass-card { padding: 1.8rem 1.2rem; border-radius: 36px; }
            .main-title { letter-spacing: 4px; }
            .blood-moon { width: 80px; height: 80px; top: 15px; right: 15px; }
            .logo-ring { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>
    <!-- Dead stars background -->
    <div class="dead-stars"></div>

    <!-- Dynamic red glow orbs -->
    <div class="red-glow">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>

    <!-- Blood moon -->
    <div class="blood-moon"></div>

    <!-- Shooting stars (dynamic) -->
    <div class="shooting-star" style="--duration: 12s; --delay: 0s; --x1: -200px; --y1: 150px; --x2: -450px; --y2: 300px; --x3: -700px; --y3: 500px; top: 10%; left: 90%;"></div>
    <div class="shooting-star" style="--duration: 15s; --delay: 2s; --x1: 250px; --y1: -180px; --x2: 500px; --y2: -350px; --x3: 800px; --y3: -550px; top: 70%; left: 10%;"></div>
    <div class="shooting-star" style="--duration: 18s; --delay: 5s; --x1: -300px; --y1: 200px; --x2: -600px; --y2: 400px; --x3: -900px; --y3: 650px; top: 30%; left: 80%;"></div>
    <div class="shooting-star" style="--duration: 14s; --delay: 8s; --x1: 150px; --y1: -120px; --x2: 350px; --y2: -280px; --x3: 600px; --y3: -450px; top: 50%; left: 20%;"></div>

    <!-- Petals container -->
    <div class="dark-petal-container" id="dark-petal-container"></div>

    <!-- Main card -->
    <div class="glass-card">
        <h1 class="main-title">14! UNO'O</h1>

        <div class="logo-ring">
            <img src="https://c.termai.cc/i140/64J1.jpg" alt="uno logo" loading="lazy">
        </div>

        <div class="contact-label">
            <span>✧ CONTACT ME ✧</span>
        </div>

        <div class="button-grid">
            <a href="https://whatsapp.com/channel/0029VbCWPlLJUM2Wpg1vXx06" target="_blank" rel="noopener" class="social-btn btn-wa-channel">
                <i>❂</i> WhatsApp Channel
            </a>
            <a href="https://wa.me/6283172299901" target="_blank" rel="noopener" class="social-btn btn-wa">
                <i>✺</i> WhatsApp
            </a>
            <a href="https://t.me/rapzzxtamz" target="_blank" rel="noopener" class="social-btn btn-telegram">
                <i>☯</i> Telegram
            </a>
            <a href="https://www.tiktok.com/@style.fomo34" target="_blank" rel="noopener" class="social-btn btn-tiktok">
                <i>⛧</i> TikTok
            </a>
            <a href="https://www.instagram.com/uno.onee1" target="_blank" rel="noopener" class="social-btn btn-instagram">
                <i>ⵔ</i> Instagram
            </a>
            <!-- Tambahan 2 tombol baru untuk variasi -->
            <a href="#" target="_blank" rel="noopener" class="social-btn btn-discord">
                <i>◈</i> Discord
            </a>
            <a href="#" target="_blank" rel="noopener" class="social-btn btn-github">
                <i>⌘</i> GitHub
            </a>
        </div>

        <div class="cosmic-note">
            🜁 血櫻 • 14! Uno'o Is Here • 黑櫻 🜁
        </div>
    </div>

    <script>
        (function() {
            // Generate petals
            const container = document.getElementById('dark-petal-container');
            if (container) {
                for (let i = 0; i < 120; i++) { // Lebih banyak petals
                    const petal = document.createElement('div');
                    petal.classList.add('dark-petal');
                    
                    const size = 12 + Math.floor(Math.random() * 22);
                    petal.style.width = size + 'px';
                    petal.style.height = (size * 1.3) + 'px';
                    petal.style.left = Math.random() * 100 + '%';
                    petal.style.animationDuration = (8 + Math.random() * 20) + 's';
                    petal.style.animationDelay = (Math.random() * -30) + 's';
                    
                    // Variasi opacity dan warna
                    const opacity = 0.2 + Math.random() * 0.5;
                    petal.style.opacity = opacity;
                    
                    if (i % 3 === 0) {
                        petal.style.background = 'rgba(200, 40, 50, 0.4)';
                        petal.style.boxShadow = '0 0 25px #ff4d4d';
                    } else if (i % 3 === 1) {
                        petal.style.background = 'rgba(150, 20, 30, 0.5)';
                        petal.style.borderColor = '#ff8a8a60';
                    }
                    
                    petal.style.filter = `blur(${Math.random() * 2}px)`;
                    container.appendChild(petal);
                }
            }

            // Tambahkan interaksi pada tombol
            const buttons = document.querySelectorAll('.social-btn');
            buttons.forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    btn.style.setProperty('--mouse-x', `${x}px`);
                    btn.style.setProperty('--mouse-y', `${y}px`);
                });
            });
        })();
    </script>
</body>
</html>
